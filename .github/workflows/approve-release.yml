name: Approve production release
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: 'Successful release-plan run ID reviewed in GitHub and private S3 plan'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: terraform-production
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TF_IN_AUTOMATION: 'true'
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-assistant-apply
          aws-region: us-east-1
      - name: Verify approved plan provenance
        id: plan
        run: python infra/tools/release.py verify --run-id "$PLAN_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.commit }}
      - name: Apply the exact approved plan
        run: python infra/tools/release.py apply --run-id "$PLAN_RUN_ID"
      - name: Verify deployment control plane
        run: python infra/tools/release.py smoke
