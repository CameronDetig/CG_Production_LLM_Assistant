name: Deploy web frontend

on:
  pull_request:
    paths: ["frontend_web/**", ".github/workflows/deploy-frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend_web/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Production deploys queue; PR verification gets its own cancellable group so it never waits on a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-pr-{0}', github.ref) || 'frontend-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  FRONTEND_BUCKET: cg-assistant-web-001879457662-us-east-1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend_web
      - name: Test
        run: npm test
        working-directory: frontend_web
      - name: Lint
        run: npm run lint
        working-directory: frontend_web
      - name: Build
        run: npm run build
        working-directory: frontend_web
      - name: Save the tested build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend_web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    # The OIDC trust policy also pins the main branch; this keeps the workflow honest on its own.
    # Do not add a job `environment:` without updating the role trust, since it changes the OIDC sub claim.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Ship exactly the build that passed tests and lint in `verify`.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend_web/dist
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-assistant-frontend-deploy
          aws-region: us-east-1
      - name: Publish immutable assets
        # No --delete: open tabs and edge-cached index.html may still reference the previous
        # release's hashed chunks. Stale files are pruned in a later step after a grace period.
        run: >-
          aws s3 sync frontend_web/dist/assets "s3://$FRONTEND_BUCKET/assets"
          --cache-control "public,max-age=31536000,immutable"
      - name: Publish entry point
        run: >-
          aws s3 sync frontend_web/dist "s3://$FRONTEND_BUCKET"
          --delete --exclude "assets/*" --exclude "config.json"
          --cache-control "no-cache"
      - name: Invalidate entry point
        shell: bash
        run: |
          distribution_id=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='CG Production Assistant web and API'].Id | [0]" --output text)
          test -n "$distribution_id" && test "$distribution_id" != "None"
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/" "/index.html"
      - name: Prune stale assets after grace period
        shell: bash
        env:
          GRACE_DAYS: '14'
        run: |
          set -euo pipefail
          (cd frontend_web/dist && find assets -type f | sort) > current.txt
          cutoff=$(date -u -d "-${GRACE_DAYS} days" +%Y-%m-%dT%H:%M:%S)
          aws s3api list-objects-v2 --bucket "$FRONTEND_BUCKET" --prefix assets/ \
            --query "Contents[?LastModified<'${cutoff}'].Key" --output text \
            | tr '\t' '\n' | sed '/^None$/d;/^$/d' | sort > old.txt
          comm -23 old.txt current.txt > stale.txt
          echo "Pruning $(wc -l < stale.txt) stale asset(s)"
          while read -r key; do
            aws s3 rm "s3://$FRONTEND_BUCKET/$key"
          done < stale.txt
