name: Deploy web frontend

on:
  pull_request:
  push:
    branches: [main]
    paths: ["frontend_web/**", ".github/workflows/deploy-frontend.yml"]

permissions:
  contents: read

# This workflow only verifies and builds; deploying is the frontend job of the manual approve-release.yml workflow.
# PR runs get their own cancellable group; pushes to main queue so every build is kept.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-pr-{0}', github.ref) || 'frontend-build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend_web
      - name: Test
        run: npm test
        working-directory: frontend_web
      - name: Lint
        run: npm run lint
        working-directory: frontend_web
      - name: Build
        run: npm run build
        working-directory: frontend_web
      - name: Save the tested build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend_web/dist
          if-no-files-found: error
          retention-days: 30
