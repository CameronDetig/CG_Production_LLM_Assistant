name: Backend checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # The mocked regression tests need only these; the full ML stack is exercised by the image build.
      - name: Install test dependencies
        run: python -m pip install boto3 'python-jose[cryptography]' requests sqlglot==26.2.1
      - name: Run mocked regression tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s tests/backend -p 'test_*.py'
          python tests/backend/test_warmup.py
      - name: Run Blender client tests (standard library only)
        run: python -m unittest discover -s tests/frontend_blender -p 'test_*.py'
      - name: Run smoke script unit tests (no network)
        run: python -m unittest discover -s tests/smoke -p 'test_*.py'
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Check free disk
        run: |
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          [ "$available" -ge 25000000 ] || { echo 'Build needs at least 25 GB free disk.' >&2; exit 1; }
      - name: Build image (no push)
        run: >-
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false
          --cache-from type=gha,scope=backend --cache-to type=gha,scope=backend,mode=max
          backend
