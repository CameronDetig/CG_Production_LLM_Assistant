name: Backend checks
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # The mocked regression tests need only these; the full ML stack is exercised by the image build.
      - name: Install test dependencies
        run: python -m pip install boto3 'python-jose[cryptography]' requests
      - name: Run mocked regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m unittest testing.test_streaming
          python testing/test_cognito.py
          python testing/test_warmup.py
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Check free disk
        run: |
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          [ "$available" -ge 25000000 ] || { echo 'Build needs at least 25 GB free disk.' >&2; exit 1; }
      - name: Build image (no push)
        run: >-
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false
          --cache-from type=gha,scope=backend --cache-to type=gha,scope=backend,mode=max
          backend
