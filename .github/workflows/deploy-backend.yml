name: Plan assistant release
on:
  push:
    branches: [main]
    paths: ['backend/**', 'infra/**', '.github/workflows/deploy-backend.yml', '.github/workflows/approve-release.yml']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Rollback: retained sha256 digest; blank reuses the current image'
        type: string
        default: ''
      adoption:
        description: 'Import-only baseline; reject effective resource changes'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: terraform-production
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  ECR_URI: 001879457662.dkr.ecr.us-east-1.amazonaws.com/cg-chatbot
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Validate configuration and release guards
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate
          python -m unittest discover -s infra/tools -p 'test_*.py'
      - name: Detect application changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          changed=false
          if [ "$EVENT" = push ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend; then
              changed=true
            fi
          fi
          echo "build=$changed" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.changes.outputs.build == 'true'
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-assistant-build
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.changes.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.build == 'true'
      - name: Build or reuse commit image
        if: steps.changes.outputs.build == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name cg-chatbot --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -z "$digest" ]; then
            available=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "$available" -lt 25000000 ]; then
              echo 'Build needs at least 25 GB free disk. Select a larger GitHub runner.' >&2
              exit 1
            fi
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -t "$ECR_URI:$tag" backend
            digest=$(aws ecr describe-images --repository-name cg-chatbot --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "uri=$ECR_URI@$digest" >> "$GITHUB_OUTPUT"
  plan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-assistant-plan
          aws-region: us-east-1
      - name: Save private plan for review
        env:
          BUILT_IMAGE: ${{ needs.build.outputs.image_uri }}
          ROLLBACK_DIGEST: ${{ inputs.image_digest }}
          ADOPTION: ${{ inputs.adoption }}
        run: |
          set -euo pipefail
          if [ "$ADOPTION" = true ]; then
            python infra/tools/release.py plan --adoption
          else
            image="$BUILT_IMAGE"
            if [ -n "$ROLLBACK_DIGEST" ]; then
              [[ "$ROLLBACK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
              aws ecr describe-images --repository-name cg-chatbot --image-ids "imageDigest=$ROLLBACK_DIGEST" > /dev/null
              image="$ECR_URI@$ROLLBACK_DIGEST"
            elif [ -z "$image" ]; then
              image=$(python infra/tools/image.py)
            fi
            python infra/tools/release.py plan --image-uri "$image"
          fi
